name = "fo"
version = "0.3.2"
license = "MIT"
author = "Christopher Albert"
maintainer = "albert@tugraz.at"
copyright = "Copyright 2025, Christopher Albert"
description = "Fortran build cache, incremental rebuild, affected-test selection, MCP server"

[build]
auto-executables = true
auto-tests = true
auto-examples = false
module-naming = false

[install]
library = false

[dependencies]
fx = { git = "https://github.com/lazy-fortran/fx.git", branch = "main" }
# Tracking fortfront's main rather than a tag while the two move together.
# Pinning to v0.1.1 meant fixes landing in fortfront were invisible here -
# including the out-of-bounds token read that segfaults every fo run under
# gfortran 13.3, which is what Ubuntu 24.04 and so every GitHub runner has.
# Pin again once that has settled.
fortfront = { git = "https://github.com/lazy-fortran/fortfront.git", branch = "main" }
openmp = "*"

[dev-dependencies]
fo_test_os = { path = "test-support/fo_test_os" }

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

# This test includes its interposition module in the program's compilation unit.
# Explicit registration keeps fpm from linking that unit into other test mains.
[[test]]
name = "test_gremlin_generation"
source-dir = "test"
main = "test_gremlin_generation.f90"

[[test]]
name = "test_stat_memo"
source-dir = "test"
main = "test_stat_memo.f90"

[[test]]
name = "test_cmake_named_cli"
source-dir = "test"
main = "test_cmake_named_cli.f90"

# The standalone CLI fixtures share their process and JSON support modules.
# Explicit mains keep those support modules from becoming test programs.
[[test]]
name = "test_dependency_membership_cli"
source-dir = "test"
main = "test_dependency_membership_cli.f90"

[[test]]
name = "test_dependency_shadow_cli"
source-dir = "test"
main = "test_dependency_shadow_cli.f90"

[[test]]
name = "test_dispatcher_cli"
source-dir = "test"
main = "test_dispatcher_cli.f90"

[[test]]
name = "test_exec_app_cli"
source-dir = "test"
main = "test_exec_app_cli.f90"

[[test]]
name = "test_fmt_cli"
source-dir = "test"
main = "test_fmt_cli.f90"

[[test]]
name = "test_platform_link_cli"
source-dir = "test"
main = "test_platform_link_cli.f90"

[[test]]
name = "test_archive_metadata_cli"
source-dir = "test"
main = "test_archive_metadata_cli.f90"

[[test]]
name = "test_program_names_cli"
source-dir = "test"
main = "test_program_names_cli.f90"

[[test]]
name = "test_targeted_materialization_cli"
source-dir = "test"
main = "test_targeted_materialization_cli.f90"

[[test]]
name = "test_test_results_json"
source-dir = "test"
main = "test_test_results_json.f90"
