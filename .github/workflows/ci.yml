name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  flang:
    name: Flang build + focused tests
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GIT_TERMINAL_PROMPT: 0
      FO_FC: flang-21
      FO_JOBS: 2
      OMP_NUM_THREADS: 1
      FO_DISABLE_SELF_REFRESH: 1
      FO_SELF_REFRESH: 0
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM Flang 21
        run: |
          curl --fail --location https://apt.llvm.org/llvm-snapshot.gpg.key |
            sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          echo 'deb https://apt.llvm.org/noble/ llvm-toolchain-noble-21 main' |
            sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y flang-21 libomp-21-dev gfortran
          flang-21 --version
          mkdir -p "$HOME/.local/bin"
          ln -s /usr/bin/flang-21 "$HOME/.local/bin/flang"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install fpm
        run: |
          curl --fail --location -o "$HOME/.local/bin/fpm" \
            https://github.com/fortran-lang/fpm/releases/download/v0.13.0/fpm-0.13.0-linux-x86_64-gcc-12
          chmod +x "$HOME/.local/bin/fpm"
          "$HOME/.local/bin/fpm" --version

      - name: Build Fo with Flang and pin its exact image
        run: |
          fpm install --compiler flang-21 --profile release --prefix "$HOME/.local"
          digest="$(sha256sum "$HOME/.local/bin/fo" | cut -d' ' -f1)"
          driver="$RUNNER_TEMP/fo-driver-pins/$digest"
          mkdir -p "$(dirname "$driver")"
          install -m 0555 "$HOME/.local/bin/fo" "$driver"
          test "$(sha256sum "$driver" | cut -d' ' -f1)" = "$digest"
          "$driver" --version
          echo "FO_DRIVER_A=$driver" >> "$GITHUB_ENV"

      - name: Run focused tests with the Flang-built driver and compiler
        run: |
          export FO="$FO_DRIVER_A" FO_BIN="$FO_DRIVER_A"
          export TMPDIR="$RUNNER_TEMP/fo-flang-tests"
          export FO_CACHE_DIR="$RUNNER_TEMP/fo-flang-cache"
          mkdir -p "$TMPDIR"
          "$FO_DRIVER_A" test --rerun --retries 0 --verbose \
            test_compiler_dialect test_project_model test_fpm_project_model \
            test_section_capability test_native_compiler_path_cli

      - name: Retain Flang failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: flang-failure-logs
          if-no-files-found: ignore
          path: |
            build/fo/test-logs/*.log
            ${{ runner.temp }}/fo-flang-tests/**/*.log

  build-test:
    name: build + focused tests
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Never let a missing credential turn into a hung git prompt.
      GIT_TERMINAL_PROMPT: 0
    steps:
      - uses: actions/checkout@v4
        with:
          # The stale-MCP verifier archives its exact historical base commit.
          fetch-depth: 0

      - name: Install gfortran
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran
          gfortran --version | head -1

      - name: Install fpm
        run: |
          sudo curl -L -o /usr/local/bin/fpm \
            https://github.com/fortran-lang/fpm/releases/download/v0.13.0/fpm-0.13.0-linux-x86_64-gcc-12
          sudo chmod +x /usr/local/bin/fpm
          fpm --version

      - name: Build
        run: fpm build

      - name: Install fo onto PATH
        run: |
          # test_scaffold verifies that a freshly scaffolded project builds by
          # running `fo check` inside it, so `fo` has to be resolvable. Install
          # the binary just built rather than skipping the assertion: a test
          # that silently does nothing when a tool is absent is worse than one
          # that fails.
          fpm install --prefix "$HOME/.local"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify fo is the binary just built
        run: |
          test -x "$HOME/.local/bin/fo"
          "$HOME/.local/bin/fo" --version

      - name: Pin exact fo image for Gremlin driver oracle
        run: |
          umask 077
          driver="$HOME/.local/bin/fo"
          digest="$(sha256sum "$driver" | cut -d' ' -f1)"
          pinned="$RUNNER_TEMP/fo-driver-pins/$digest"
          mkdir -p "$(dirname "$pinned")"
          install -m 0555 "$driver" "$pinned"
          test "$(sha256sum "$pinned" | cut -d' ' -f1)" = "$digest"
          echo "FO_DRIVER_A=$pinned" >> "$GITHUB_ENV"

      - name: Test project model and scoped Gremlin behavior
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          export FO="$FO_DRIVER_A" FO_BIN="$FO_DRIVER_A"
          export FO_DISABLE_SELF_REFRESH=1 FO_SELF_REFRESH=0 FO_JOBS=1
          export TMPDIR="$RUNNER_TEMP/fo-focused-tests"
          mkdir -p "$TMPDIR"
          "$FO_DRIVER_A" test test_project_model test_fpm_project_model \
            test_cmake_project_model test_project_selection_cli \
            test_project_layering_cli test_gremlin_case_reuse test_gremlin_cmake \
            test_atomic_link_artifacts test_cmake_native_build_cli

      - name: Test campaign, journal and coverage recovery
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          export FO="$FO_DRIVER_A" FO_BIN="$FO_DRIVER_A"
          export FO_DISABLE_SELF_REFRESH=1 FO_SELF_REFRESH=0 FO_JOBS=1
          export OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1
          export FO_TEST_WALL_TIMEOUT=300
          export TMPDIR="$RUNNER_TEMP/fo-recovery-tests"
          mkdir -p "$TMPDIR"
          "$FO_DRIVER_A" test test_gremlin_journal_recovery \
            test_gremlin_coverage_restart test_gremlin_campaign_resolution

      - name: Test public fo test dispatch
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          export FO="$HOME/.local/bin/fo"
          export FO_DISABLE_SELF_REFRESH=1 FO_SELF_REFRESH=0
          FO_TEST_WALL_TIMEOUT=180 \
          FO_CACHE_DIR="$RUNNER_TEMP/fo-mcp-system" \
            "$HOME/.local/bin/fo" test test_mcp_system

      - name: Test Gremlin self refresh
        run: |
          export TMPDIR="$RUNNER_TEMP/fo-self-refresh-oracle-tmp"
          mkdir -p "$TMPDIR"
          # Use fpm.toml's wall cap for the cumulative cold self/profile builds.
          # Nested commands retain 180-second caps; cold release install has
          # a 900-second safety cap (317 seconds measured on GCC 12.2).
          # Run this expensive oracle once so its first failure reaches the log
          # collector instead of a cold retry consuming the job's safety budget.
          FO_BIN="$HOME/.local/bin/fo" \
          FO_RUN_SELF_REFRESH_ORACLE=1 \
          FO_DISABLE_SELF_REFRESH=1 \
          FO_SELF_REFRESH=0 \
          FO_CACHE_DIR="$RUNNER_TEMP/fo-self-refresh-oracle-cache" \
            "$HOME/.local/bin/fo" test --rerun --retries 0 --verbose \
              test_self_refresh

      - name: Retain self-refresh failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: self-refresh-failure-logs
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/fo-self-refresh-oracle-tmp/**/*.log
            ${{ runner.temp }}/fo-self-refresh-oracle-tmp/**/fo_test_case-*.tmp
            ${{ runner.temp }}/fo-self-refresh-oracle-tmp/**/fo_test_rerun-*.tmp
            build/fo/test-logs/*.log

      - name: Test install help side effects
        env:
          FO_RUN_INSTALL_HELP_ORACLE: "1"
          FO_DISABLE_SELF_REFRESH: "1"
          FO_SELF_REFRESH: "0"
          HOME: ${{ runner.temp }}/fo-install-help-home
          FO_CACHE_DIR: ${{ runner.temp }}/fo-install-help-cache
          FO_INSTALL_HELP_PREFIX: ${{ runner.temp }}/fo-install-help-prefix
          TMPDIR: /var/tmp
        run: |
          mkdir -p "$HOME" "$FO_CACHE_DIR"
          driver="$FO_DRIVER_A"
          FO_BIN="$driver" "$driver" test test_install_help

      # The retired cancellation fixture forced LD_PRELOAD EPERM/backoff; #161
      # excludes that artificial syscall window. Its cleanup probe tested only
      # the JS fixture's own process-group helper, not Fo behavior.
      - name: Test stale MCP recovery
        run: |
          driver="$FO_DRIVER_A"
          FO="$driver" FO_BIN="$driver" FO_DISABLE_SELF_REFRESH=1 FO_SELF_REFRESH=0 \
            "$driver" test test_mcp_gremlin_stale

      - name: Test MCP cancellation and diagnostics
        run: |
          driver="$FO_DRIVER_A"
          FO="$driver" FO_BIN="$driver" FO_DISABLE_SELF_REFRESH=1 FO_SELF_REFRESH=0 \
            "$driver" test test_mcp_cancel_error

      - name: Test standalone asynchronous process C fixtures
        run: |
          verifier_dir="$(mktemp -d)"
          trap 'rm -rf "$verifier_dir"' EXIT
          fixture_dir=test-fixtures/c
          process_dependencies=(src/proc/fo_gremlin_state.c
                                src/proc/fo_execution_scratch.c src/util/fo_fs.c)
          cc -std=gnu11 -O2 -Wall -Wextra -Wno-unused-function \
            "$fixture_dir/async_filter.c" "${process_dependencies[@]}" -o "$verifier_dir/filter-native"
          "$verifier_dir/filter-native"
          for target in AARCH64 ARM X86_64 UNSUPPORTED; do
            cc -std=gnu11 -O2 -Wall -Wextra -Wno-unused-function \
              "-DFO_ASYNC_TEST_$target" "$fixture_dir/async_filter.c" \
              "${process_dependencies[@]}" \
              -o "$verifier_dir/filter-$target"
            "$verifier_dir/filter-$target"
          done
          cc -std=gnu11 -O2 -Wall -Wextra -Wno-unused-function \
            "$fixture_dir/async_process_nested.c" "${process_dependencies[@]}" \
            -o "$verifier_dir/nested"
          "$verifier_dir/nested"
          cc -std=gnu11 -O2 -Wall -Wextra -Wno-unused-function \
            "$fixture_dir/async_process_nested_cancel.c" "${process_dependencies[@]}" \
            -o "$verifier_dir/nested-cancel"
          "$verifier_dir/nested-cancel"
