name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build + fpm test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Never let a missing credential turn into a hung git prompt.
      GIT_TERMINAL_PROMPT: 0
    steps:
      - uses: actions/checkout@v4
        with:
          # The stale-MCP verifier archives its exact historical base commit.
          fetch-depth: 0

      - name: Install gfortran
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran
          gfortran --version | head -1

      - name: Install fpm
        run: |
          sudo curl -L -o /usr/local/bin/fpm \
            https://github.com/fortran-lang/fpm/releases/download/v0.13.0/fpm-0.13.0-linux-x86_64-gcc-12
          sudo chmod +x /usr/local/bin/fpm
          fpm --version

      - name: Build
        run: fpm build

      - name: Install fo onto PATH
        run: |
          # test_scaffold verifies that a freshly scaffolded project builds by
          # running `fo check` inside it, so `fo` has to be resolvable. Install
          # the binary just built rather than skipping the assertion: a test
          # that silently does nothing when a tool is absent is worse than one
          # that fails.
          fpm install --prefix "$HOME/.local"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify fo is the binary just built
        run: |
          command -v fo
          fo --version || true

      - name: Test
        run: fpm test

      - name: Test complete JSON reports
        run: node test/test_test_results_json.js

      - name: Test complete MCP JSON reports
        run: node test/test_mcp_test_json.js

      - name: Test application exec build scope
        run: node test/test_exec_app.js

      - name: Test consolidated test routing
        run: node test/test_dispatcher_cli.js

      - name: Test targeted executable materialization
        run: node test/test_targeted_materialization_cli.js

      - name: Test Gremlin bootstrap lifecycle
        run: node test/test_gremlin_bootstrap.js "$(command -v fo)"

      - name: Test Gremlin journal owner recovery
        run: node test/test_gremlin_journal_recovery.js "$(command -v fo)"

      - name: Test MCP Gremlin parity
        run: node test/test_mcp_gremlin.js "$(command -v fo)"

      - name: Test MCP named-test eligibility
        run: node test/test_mcp_named_eligibility.js "$(command -v fo)"

      - name: Test stale MCP recovery
        run: node test/test_mcp_gremlin_stale.js "$(command -v fo)"

      - name: Test shared work modes
        run: node test/test_work_modes.js "$(command -v fo)"

      - name: Test MCP cancellation backoff
        run: node test/test_mcp_cancel_error.js "$(command -v fo)"

      - name: Test MCP cancellation cleanup probe
        run: node test/test_mcp_cancel_error.js "$(command -v fo)" --cleanup-probe

      - name: Test asynchronous process lifecycle
        env:
          HOME: ${{ runner.temp }}/fo-async-home
          XDG_CONFIG_HOME: ${{ runner.temp }}/fo-async-xdg-config
          XDG_CACHE_HOME: ${{ runner.temp }}/fo-async-xdg-cache
          FO_PREFIX: ${{ runner.temp }}/fo-async-prefix
          FO_CACHE_DIR: ${{ runner.temp }}/fo-async-cache
          FO_GREMLIN_STATE_DIR: ${{ runner.temp }}/fo-async-state
          FO_SELF_REFRESH: "0"
          FO_DISABLE_SELF_REFRESH: "1"
          TMPDIR: /var/tmp
        run: node test/test_async_process_lifecycle.js "$(command -v fo)"

      - name: Test nested process timeout containment
        run: |
          verifier_dir="$(mktemp -d)"
          trap 'rm -rf "$verifier_dir"' EXIT
          cc -std=gnu11 -O2 -Wall -Wextra -Wno-unused-function \
            test/test_async_process_nested_cancel.c \
            -o "$verifier_dir/nested-cancel"
          "$verifier_dir/nested-cancel"

      - name: Test formatter executable behavior
        run: |
          node test/test_fmt_cli.js
          node test/test_program_names_cli.js
          node test/test_dependency_membership_cli.js
          node test/test_platform_link_cli.js

      - name: Test atomic link artifact publication
        run: node test/test_archive_publication.js
