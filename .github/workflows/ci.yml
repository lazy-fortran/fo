name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build + fpm test
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Never let a missing credential turn into a hung git prompt.
      GIT_TERMINAL_PROMPT: 0
    steps:
      - uses: actions/checkout@v4
        with:
          # The stale-MCP verifier archives its exact historical base commit.
          fetch-depth: 0

      - name: Install gfortran
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran
          gfortran --version | head -1

      - name: Install fpm
        run: |
          sudo curl -L -o /usr/local/bin/fpm \
            https://github.com/fortran-lang/fpm/releases/download/v0.13.0/fpm-0.13.0-linux-x86_64-gcc-12
          sudo chmod +x /usr/local/bin/fpm
          fpm --version

      - name: Build
        run: fpm build

      - name: Install fo onto PATH
        run: |
          # test_scaffold verifies that a freshly scaffolded project builds by
          # running `fo check` inside it, so `fo` has to be resolvable. Install
          # the binary just built rather than skipping the assertion: a test
          # that silently does nothing when a tool is absent is worse than one
          # that fails.
          fpm install --prefix "$HOME/.local"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify fo is the binary just built
        run: |
          command -v fo
          fo --version || true

      - name: Test
        run: fpm test

      - name: Test standalone Fortran CLI fixtures
        run: |
          export FO="$(command -v fo)"
          export FO_DISABLE_SELF_REFRESH=1
          export FO_SELF_REFRESH=0
          export FO_CACHE_DIR="$RUNNER_TEMP/fo-cli-tests"
          fo test test_cmake_named_cli test_dependency_membership_cli \
            test_dependency_shadow_cli test_dispatcher_cli test_exec_app_cli \
            test_fmt_cli test_platform_link_cli test_program_names_cli \
            test_targeted_materialization_cli test_test_results_json \
            test_atomic_link_artifacts test_archive_publication test_test_os_link

      - name: Test complete MCP JSON reports
        run: FO="$(command -v fo)" fo test test_mcp_test_json
        env:
          FO_DISABLE_SELF_REFRESH: "1"
          FO_SELF_REFRESH: "0"
          FO_CACHE_DIR: ${{ runner.temp }}/fo-mcp-json

      - name: Test MCP protocol and named eligibility in Fortran
        run: |
          export FO="$(command -v fo)"
          export FO_DISABLE_SELF_REFRESH=1
          export FO_SELF_REFRESH=0
          FO_TEST_WALL_TIMEOUT=180 FO_CACHE_DIR="$RUNNER_TEMP/fo-mcp-system" \
            fo test test_mcp_system
          FO_CACHE_DIR="$RUNNER_TEMP/fo-mcp-named" fo test test_mcp_named_eligibility
          FO_CACHE_DIR="$RUNNER_TEMP/fo-mcp-request" fo test test_mcp_request_structure
          FO_CACHE_DIR="$RUNNER_TEMP/fo-mcp-ownership" fo test test_mcp_response_ownership

      - name: Test Gremlin bootstrap lifecycle
        run: node test/test_gremlin_bootstrap.js "$(command -v fo)"

      - name: Test Gremlin journal owner recovery
        run: node test/test_gremlin_journal_recovery.js "$(command -v fo)"

      - name: Test continuous generation preemption
        run: node test/test_continuous_preemption.js "$(command -v fo)"

      - name: Test Gremlin campaign history
        run: fo test test_gremlin_campaign_history

      - name: Test Gremlin context provenance
        run: node test/test_gremlin_context_provenance.js "$(command -v fo)"

      - name: Test Gremlin timeout ordering
        run: node test/test_gremlin_timeout_order.js "$(command -v fo)"

      - name: Test Gremlin reproduction logs
        run: |
          node test/test_gremlin_reproduce_logs.js "$(command -v fo)"
          node test/test_gremlin_reproduce_concurrent_logs.js "$(command -v fo)"

      - name: Test Gremlin self refresh
        run: |
          FO_BIN="$HOME/.local/bin/fo" \
          FO_RUN_SELF_REFRESH_ORACLE=1 \
          FO_DISABLE_SELF_REFRESH=1 \
          FO_SELF_REFRESH=0 \
          FO_TEST_WALL_TIMEOUT=240 \
          FO_CACHE_DIR="$RUNNER_TEMP/fo-self-refresh-oracle-cache" \
            "$HOME/.local/bin/fo" test test_self_refresh

      - name: Test Gremlin filesystem change capture
        run: node test/test_gremlin_watch.js "$(command -v fo)"

      - name: Test MCP Gremlin parity
        run: node test/test_mcp_gremlin.js "$(command -v fo)"

      - name: Test stale MCP recovery
        run: node test/test_mcp_gremlin_stale.js "$(command -v fo)"

      - name: Test MCP cancellation backoff
        run: node test/test_mcp_cancel_error.js "$(command -v fo)"

      - name: Test MCP cancellation cleanup probe
        run: node test/test_mcp_cancel_error.js "$(command -v fo)" --cleanup-probe

      - name: Test asynchronous process lifecycle
        env:
          HOME: ${{ runner.temp }}/fo-async-home
          XDG_CONFIG_HOME: ${{ runner.temp }}/fo-async-xdg-config
          XDG_CACHE_HOME: ${{ runner.temp }}/fo-async-xdg-cache
          FO_PREFIX: ${{ runner.temp }}/fo-async-prefix
          FO_CACHE_DIR: ${{ runner.temp }}/fo-async-cache
          FO_GREMLIN_STATE_DIR: ${{ runner.temp }}/fo-async-state
          FO_SELF_REFRESH: "0"
          FO_DISABLE_SELF_REFRESH: "1"
          TMPDIR: /var/tmp
        run: node test/test_async_process_lifecycle.js "$(command -v fo)"

      - name: Test standalone asynchronous process C fixtures
        run: |
          verifier_dir="$(mktemp -d)"
          trap 'rm -rf "$verifier_dir"' EXIT
          fixture_dir=test-fixtures/c
          cc -std=gnu11 -O2 -Wall -Wextra -Wno-unused-function \
            "$fixture_dir/async_filter.c" -o "$verifier_dir/filter-native"
          "$verifier_dir/filter-native"
          for target in AARCH64 ARM X86_64 UNSUPPORTED; do
            cc -std=gnu11 -O2 -Wall -Wextra -Wno-unused-function \
              "-DFO_ASYNC_TEST_$target" "$fixture_dir/async_filter.c" \
              -o "$verifier_dir/filter-$target"
            "$verifier_dir/filter-$target"
          done
          cc -std=gnu11 -O2 -Wall -Wextra -Wno-unused-function \
            "$fixture_dir/async_process_nested.c" \
            -o "$verifier_dir/nested"
          "$verifier_dir/nested"
          cc -std=gnu11 -O2 -Wall -Wextra -Wno-unused-function \
            "$fixture_dir/async_process_nested_cancel.c" \
            -o "$verifier_dir/nested-cancel"
          "$verifier_dir/nested-cancel"
